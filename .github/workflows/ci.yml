name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  Build:
    name: Build (${{ matrix.Os }})
    runs-on: ${{ matrix.Os }}
    strategy:
      fail-fast: false
      matrix:
        Os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build
          -DDESKLINK_BUILD_WINDOWS_BACKENDS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  Sanitizers:
    name: GCC sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: >-
          cmake -S . -B build-sanitizers
          -DDESKLINK_BUILD_WINDOWS_BACKENDS=OFF
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-sanitizers --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  MsQuicAdapter:
    name: MsQuic 2.6.0 adapter
    runs-on: windows-latest

    steps:
      - name: Checkout DeskLink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned MsQuic package
        run: >-
          nuget install Microsoft.Native.Quic.MsQuic.Schannel
          -Version 2.6.0
          -OutputDirectory external
          -ExcludeVersion
          -NonInteractive

      - name: Verify pinned MsQuic runtime
        shell: pwsh
        run: |
          $Runtime = 'external/Microsoft.Native.Quic.MsQuic.Schannel/build/native/bin/x64/msquic.dll'
          $Expected = 'C981E61CD207F42D46B54EF7DBF1049F1F836424C3BA981F4469AC2B2BEA9610'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Runtime).Hash -ne $Expected) {
            throw 'Downloaded MsQuic 2.6.0 Schannel runtime digest did not match the reviewed artifact.'
          }

      - name: Configure
        run: >-
          cmake -S . -B build-msquic
          -DDESKLINK_BUILD_MSQUIC=ON
          -DDESKLINK_MSQUIC_ROOT=${{ github.workspace }}/external/Microsoft.Native.Quic.MsQuic.Schannel

      - name: Build adapter, pairing control, and native loopback
        run: >-
          cmake --build build-msquic --config Release
          --target desklink_msquic_runtime_tests desklink_msquic_loopback_tests desklink_pair desklink_alpha
          --parallel 2

      - name: Run pinned-runtime and native MsQuic loopback tests
        run: >-
          ctest --test-dir build-msquic -C Release
          -R "desklink_msquic_(runtime|loopback)_tests" --output-on-failure

      - name: Package native alpha wrapper
        run: cpack --config build-msquic/CPackConfig.cmake -C Release

  Windows10Prototype:
    name: Windows 10 opaque CNG prototype
    runs-on: windows-latest

    steps:
      - name: Checkout DeskLink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned MsQuic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/msquic
          ref: e7e7a114e20a55ec2d5f723cf6bdf3bfb7b0b24a
          path: external/msquic
          submodules: recursive

      - name: Checkout pinned OpenSSL source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openssl/openssl
          ref: 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e
          path: external/openssl

      - name: Install pinned Schannel package
        run: >-
          nuget install Microsoft.Native.Quic.MsQuic.Schannel
          -Version 2.6.0
          -OutputDirectory external
          -ExcludeVersion
          -NonInteractive

      - name: Verify pinned Schannel runtime
        shell: pwsh
        run: |
          $Runtime = 'external/Microsoft.Native.Quic.MsQuic.Schannel/build/native/bin/x64/msquic.dll'
          $Expected = 'C981E61CD207F42D46B54EF7DBF1049F1F836424C3BA981F4469AC2B2BEA9610'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Runtime).Hash -ne $Expected) {
            throw 'Downloaded MsQuic 2.6.0 Schannel runtime digest did not match the reviewed artifact.'
          }

      - name: Build pinned OpenSSL 3.5.7
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where nmake
          cd /d "%GITHUB_WORKSPACE%\external\openssl"
          perl Configure VC-WIN64A no-asm no-tests --prefix="%GITHUB_WORKSPACE%\external\openssl-install" --openssldir="%GITHUB_WORKSPACE%\external\openssl-install\ssl"
          nmake
          nmake install_sw

      - name: Build and test opaque CNG prototype
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where nmake
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Build-Windows10Compat.ps1 -MsQuicSource external\msquic -OpenSslRoot external\openssl-install -SchannelRoot external\Microsoft.Native.Quic.MsQuic.Schannel

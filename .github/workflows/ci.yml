name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  Build:
    name: Build (${{ matrix.Os }})
    runs-on: ${{ matrix.Os }}
    strategy:
      fail-fast: false
      matrix:
        Os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build
          -DDESKLINK_BUILD_WINDOWS_BACKENDS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  Sanitizers:
    name: GCC sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: >-
          cmake -S . -B build-sanitizers
          -DDESKLINK_BUILD_WINDOWS_BACKENDS=OFF
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-sanitizers --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  MsQuicAdapter:
    name: MsQuic 2.5.8 adapter
    runs-on: windows-latest

    steps:
      - name: Checkout DeskLink
        uses: actions/checkout@v7

      - name: Install pinned MsQuic package
        run: >-
          nuget install Microsoft.Native.Quic.MsQuic.Schannel
          -Version 2.5.8
          -OutputDirectory external
          -ExcludeVersion
          -NonInteractive

      - name: Configure
        run: >-
          cmake -S . -B build-msquic
          -DDESKLINK_BUILD_MSQUIC=ON
          -DDESKLINK_MSQUIC_ROOT=${{ github.workspace }}/external/Microsoft.Native.Quic.MsQuic.Schannel

      - name: Build adapter, pairing control, and native loopback
        run: >-
          cmake --build build-msquic --config Release
          --target desklink_msquic_loopback_tests desklink_pair --parallel 2

      - name: Run native MsQuic loopback
        run: >-
          ctest --test-dir build-msquic -C Release
          -R desklink_msquic_loopback_tests --output-on-failure

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  Build:
    name: Build (${{ matrix.Os }})
    runs-on: ${{ matrix.Os }}
    strategy:
      fail-fast: false
      matrix:
        Os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build
          -DDESKLINK_BUILD_WINDOWS_BACKENDS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  Sanitizers:
    name: GCC sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: >-
          cmake -S . -B build-sanitizers
          -DDESKLINK_BUILD_WINDOWS_BACKENDS=OFF
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-sanitizers --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  MsQuicAdapter:
    name: MsQuic 2.6.0 adapter
    runs-on: windows-latest

    steps:
      - name: Checkout DeskLink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned MsQuic package
        run: >-
          nuget install Microsoft.Native.Quic.MsQuic.Schannel
          -Version 2.6.0
          -OutputDirectory external
          -ExcludeVersion
          -NonInteractive

      - name: Verify pinned MsQuic runtime
        shell: pwsh
        run: |
          $Runtime = 'external/Microsoft.Native.Quic.MsQuic.Schannel/build/native/bin/x64/msquic.dll'
          $Expected = 'C981E61CD207F42D46B54EF7DBF1049F1F836424C3BA981F4469AC2B2BEA9610'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Runtime).Hash -ne $Expected) {
            throw 'Downloaded MsQuic 2.6.0 Schannel runtime digest did not match the reviewed artifact.'
          }

      - name: Configure
        run: >-
          cmake -S . -B build-msquic
          -DDESKLINK_BUILD_MSQUIC=ON
          -DDESKLINK_MSQUIC_ROOT=${{ github.workspace }}/external/Microsoft.Native.Quic.MsQuic.Schannel

      - name: Build adapter, pairing control, and native loopback
        run: >-
          cmake --build build-msquic --config Release
          --target desklink_msquic_runtime_tests desklink_msquic_loopback_tests desklink_pair desklink_alpha desklink_update_validation
          --parallel 2

      - name: Run pinned-runtime and native MsQuic loopback tests
        run: >-
          ctest --test-dir build-msquic -C Release
          -R "desklink_msquic_(runtime|loopback)_tests" --output-on-failure

      - name: Package native alpha wrapper
        run: cpack --config build-msquic/CPackConfig.cmake -C Release

      - name: Stage native alpha wrapper for the installer
        run: >-
          cmake --install build-msquic --config Release
          --prefix installer-stage --component Alpha

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          # Inno Setup's /DIR switch is parsed by the child installer. Keep this
          # temporary path free of spaces so Start-Process cannot split it while
          # reconstructing the native command line.
          $ToolRoot = Join-Path $env:RUNNER_TEMP 'inno-7.1.0'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $Installer
          $Expected = '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Installer).Hash -ne $Expected) {
            throw 'Downloaded Inno Setup 7.1.0 digest did not match the immutable release artifact.'
          }
          $Signature = Get-AuthenticodeSignature -LiteralPath $Installer
          $Publisher = if ($Signature.SignerCertificate) {
            $Signature.SignerCertificate.GetNameInfo(
              [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false)
          }
          if ($Signature.Status -ne 'Valid' -or
              $Publisher -ne 'Pyrsys B.V.') {
            throw 'Downloaded Inno Setup compiler did not have the expected valid Authenticode publisher.'
          }
          $Process = Start-Process -FilePath $Installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-',
            '/CURRENTUSER', ('/DIR=' + $ToolRoot)
          ) -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            throw "Inno Setup compiler installation failed with exit code $($Process.ExitCode)."
          }
          $Compiler = Join-Path $ToolRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $Compiler -PathType Leaf)) {
            throw "Inno Setup reported success but did not install the compiler at $Compiler."
          }
          "DESKLINK_ISCC=$Compiler" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prove the production signing gate fails closed
        shell: pwsh
        run: |
          $Rejected = $false
          try {
            ./scripts/Build-WindowsInstaller.ps1 `
              -StagePath installer-stage `
              -OutputPath "$env:RUNNER_TEMP\DeskLink-should-not-build.exe" `
              -IsccPath $env:DESKLINK_ISCC
          } catch {
            $Rejected = $true
            Write-Host "[Packaging:Installer] expected signing refusal: $($_.Exception.Message)"
          }
          if (-not $Rejected) {
            throw 'Production packaging unexpectedly succeeded without signing authority.'
          }

      - name: Build unsigned development installers
        shell: pwsh
        run: |
          ./scripts/Build-WindowsInstaller.ps1 `
            -StagePath installer-stage `
            -OutputPath DeskLink-Alpha-0.1.0-windows-x64-unsigned.exe `
            -IsccPath $env:DESKLINK_ISCC `
            -AppVersion 0.1.0 `
            -DevelopmentUnsigned
          ./scripts/Build-WindowsInstaller.ps1 `
            -StagePath installer-stage `
            -OutputPath DeskLink-Alpha-0.1.1-windows-x64-unsigned.exe `
            -IsccPath $env:DESKLINK_ISCC `
            -AppVersion 0.1.1 `
            -DevelopmentUnsigned

      - name: Validate current-user install, upgrade, and uninstall
        shell: pwsh
        run: |
          ./scripts/Test-WindowsInstaller.ps1 `
            -InstallerPath DeskLink-Alpha-0.1.0-windows-x64-unsigned.exe `
            -UpgradeInstallerPath DeskLink-Alpha-0.1.1-windows-x64-unsigned.exe `
            -ExpectedUpgradeVersion 0.1.1 `
            -UpdateValidationPath build-msquic/Release/desklink_update_validation.exe `
            -AllowCurrentUserMutation

      - name: Upload Windows alpha packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DeskLink-Alpha-0.1.0-windows-x64
          if-no-files-found: error
          path: |
            DeskLink-Alpha-0.1.0-windows-x64.zip
            DeskLink-Alpha-0.1.0-windows-x64-unsigned.exe

  Windows10Prototype:
    name: Windows 10 opaque CNG prototype
    runs-on: windows-latest

    steps:
      - name: Checkout DeskLink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned MsQuic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/msquic
          ref: e7e7a114e20a55ec2d5f723cf6bdf3bfb7b0b24a
          path: external/msquic
          submodules: recursive

      - name: Checkout pinned OpenSSL source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openssl/openssl
          ref: 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e
          path: external/openssl

      - name: Install pinned Schannel package
        run: >-
          nuget install Microsoft.Native.Quic.MsQuic.Schannel
          -Version 2.6.0
          -OutputDirectory external
          -ExcludeVersion
          -NonInteractive

      - name: Verify pinned Schannel runtime
        shell: pwsh
        run: |
          $Runtime = 'external/Microsoft.Native.Quic.MsQuic.Schannel/build/native/bin/x64/msquic.dll'
          $Expected = 'C981E61CD207F42D46B54EF7DBF1049F1F836424C3BA981F4469AC2B2BEA9610'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Runtime).Hash -ne $Expected) {
            throw 'Downloaded MsQuic 2.6.0 Schannel runtime digest did not match the reviewed artifact.'
          }

      - name: Build pinned OpenSSL 3.5.7
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where nmake
          cd /d "%GITHUB_WORKSPACE%\external\openssl"
          perl Configure VC-WIN64A no-asm no-tests --prefix="%GITHUB_WORKSPACE%\external\openssl-install" --openssldir="%GITHUB_WORKSPACE%\external\openssl-install\ssl"
          nmake
          nmake install_sw

      - name: Build and test opaque CNG prototype
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where nmake
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Build-Windows10Compat.ps1 -MsQuicSource external\msquic -OpenSslRoot external\openssl-install -SchannelRoot external\Microsoft.Native.Quic.MsQuic.Schannel
